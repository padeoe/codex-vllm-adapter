# Stock vLLM + the adapter. Nothing here is a fork: the vLLM image is the official one
# and the adapter is a ~10 KB stdlib-only sidecar.
#
# Point Codex at http://127.0.0.1:8010/v1
#
#   docker compose up -d
#
# Adjust MODEL_DIR and the served model name for your checkpoint.
services:
  vllm:
    image: vllm/vllm-openai:v0.27.1
    container_name: codex-vllm
    ipc: host
    restart: unless-stopped
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
    volumes:
      - ${MODEL_DIR:?set MODEL_DIR to your checkpoint directory}:/models/llm:ro
      # Generated by tools/patch_chat_template.py. Required for Qwen3.5/3.8: the stock
      # template rejects Codex's `developer` role. Thinking is NOT patched here -- the
      # adapter controls it per request (see docs/THINKING.md).
      - ./chat_template.codex.jinja:/etc/chat_template.jinja:ro
      - vllm-cache:/root/.cache/vllm
    ports:
      - "127.0.0.1:8000:8000"
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
    entrypoint: ["vllm", "serve", "/models/llm"]
    command:
      # IMPORTANT: serve under your real model id. A `gpt-5.6-*` name puts Codex into
      # code-mode-only and breaks every tool call -- see docs/TROUBLESHOOTING.md.
      - --served-model-name=${MODEL_NAME:-Qwen3.8-27B-FP8}
      - --chat-template=/etc/chat_template.jinja
      - --host=0.0.0.0
      - --port=8000
      - --max-model-len=262144
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder

  adapter:
    image: python:3.12-slim
    container_name: codex-vllm-adapter
    restart: unless-stopped
    depends_on: [vllm]
    volumes:
      - ../codex_vllm_adapter:/app/codex_vllm_adapter:ro
      # Optional: per-level thinking policy. Without it, thinking is off at every level.
      - ./thinking.toml:/app/thinking.toml:ro
    working_dir: /app
    ports:
      - "127.0.0.1:8010:8010"
    command:
      - python
      - -m
      - codex_vllm_adapter
      - --listen=0.0.0.0:8010
      - --upstream=http://vllm:8000
      - --thinking-config=/app/thinking.toml
      - -v

volumes:
  vllm-cache:
